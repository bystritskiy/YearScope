services:
  yearscope:
    build: .
    container_name: yearscope
    restart: unless-stopped
    ports:
      # Внутри контейнера сервис всегда слушает 3010.
      # Наружный порт меняется переменной YEARSCOPE_PORT.
      - "${YEARSCOPE_PORT:-3010}:3010"
    environment:
      # Часовой пояс должен совпадать с KoShelf, иначе чтение будет
      # раскладываться по соседним дням и месячные суммы разъедутся.
      TZ: ${TZ:-Europe/Warsaw}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-1440}
    env_file:
      # Ники, ключи и адрес KoShelf лежат там. См. .env.example.
      - .env
    volumes:
      # База и импорты переживают пересоздание контейнера.
      - ./data:/app/data
