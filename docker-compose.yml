services:
  yearscope:
    build: .
    container_name: yearscope
    restart: unless-stopped
    ports:
      # Inside the container the service always listens on 3010.
      # The external port is changed via YEARSCOPE_PORT.
      - "${YEARSCOPE_PORT:-3010}:3010"
    environment:
      # The time zone must match KoShelf, otherwise reading sessions
      # spill into neighbouring days and monthly totals drift.
      TZ: ${TZ:-Europe/Warsaw}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-1440}
    env_file:
      # Nicknames, keys and the KoShelf address live there. See .env.example.
      - .env
    volumes:
      # The database and imports survive container recreation.
      - ./data:/app/data
